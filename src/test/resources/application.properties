spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rapid_stylers}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.api.key=${APP_API_KEY:test-api-key}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:change_me}
app.jwt.secret=${JWT_SECRET:test-secret-test-secret-test-secret-test-secret}
app.resend.api-key=${RESEND_API_KEY:test-resend-key}
app.resend.from=${RESEND_FROM:onboarding@resend.dev}
app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}
app.kafka.consumers.notifications.enabled=false
app.kafka.outbox.publisher-enabled=false
# Activate the test profile: EncryptionConfig's boot guard only accepts the public
# hardcoded fallback key under this profile (see app.encrypt.key below).
spring.profiles.active=test
# Deliberately empty: tests pin the deterministic fallback key so ciphertexts stay
# stable across runs even though the local .env exports a real ENCRYPT_KEY.
app.encrypt.key=
