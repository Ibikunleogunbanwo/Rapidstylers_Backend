server.port=9095
# NOTE: do NOT set server.servlet.context-path. Controllers map /rapid_stylers/...
# themselves and the security filters expect those URIs — the app serves at root.
# Actuator: expose only the health endpoint for Docker/Nginx health checks.
management.endpoints.web.exposure.include=health

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rapid_stylers}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect
spring.jpa.hibernate.ddl-auto=update

# Flyway schema migrations. baseline-on-migrate lets Flyway adopt the
# pre-existing JPA-created schema on first boot; version 0 marks that baseline
# so V1+ migrations apply deterministically on every environment.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:America/Edmonton}

# x-api-key shared with the frontend (RapidStyler_frontend/.env REACT_APP_API_KEY)
app.api.key=${APP_API_KEY}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:9090,https://rapidstylers.ca,https://www.rapidstylers.ca}

# Admin bootstrap credentials — ADMIN_EMAIL/ADMIN_PASSWORD seed the first
# admin_accounts row on boot (BCrypt-encoded). Admin sign-in authenticates
# against that table; additional admins are managed at /admin/accounts.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Sentry error monitoring — active only when SENTRY_DSN is set; empty disables it.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${APP_ENV:local}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}

# OpenAPI/Swagger docs at /swagger-ui.html and /v3/api-docs (gated by x-api-key)
springdoc.show-actuator=false

# JWT (role-based auth)
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:15}

# Resend transactional email (replaces Gmail SMTP)
app.resend.api-key=${RESEND_API_KEY}
app.resend.from=${RESEND_FROM:onboarding@resend.dev}

# Cloudinary signed uploads (frontend uploads directly; backend signs)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}

# Stripe (card-on-file + payment intents). Set STRIPE_MODE=test or STRIPE_MODE=live
# to choose which key set is active; leave it empty (and only STRIPE_SECRET_KEY set)
# for the legacy single-key behavior. Leave everything empty to run in no-payment
# dev mode: bookings proceed without authorization.
app.stripe.mode=${STRIPE_MODE:}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.connect-webhook-secret=${STRIPE_CONNECT_WEBHOOK_SECRET:}
app.stripe.test.secret-key=${STRIPE_TEST_SECRET_KEY:}
app.stripe.test.webhook-secret=${STRIPE_TEST_WEBHOOK_SECRET:}
app.stripe.test.connect-webhook-secret=${STRIPE_TEST_CONNECT_WEBHOOK_SECRET:}
app.stripe.live.secret-key=${STRIPE_LIVE_SECRET_KEY:}
app.stripe.live.webhook-secret=${STRIPE_LIVE_WEBHOOK_SECRET:}
app.stripe.live.connect-webhook-secret=${STRIPE_LIVE_CONNECT_WEBHOOK_SECRET:}
app.stripe.currency=${STRIPE_CURRENCY:cad}
# Platform commission taken from each captured payment (Stripe Connect payout share).
app.stripe.commission-percent=${STRIPE_COMMISSION_PERCENT:10}
# Card authorizations are created immediately only inside this window. Future
# bookings are authorized 48 hours before the appointment by the scheduler.
app.booking.payment-authorization-window-days=${BOOKING_PAYMENT_AUTHORIZATION_WINDOW_DAYS:7}
app.booking.payment-authorization-lead-hours=${BOOKING_PAYMENT_AUTHORIZATION_LEAD_HOURS:48}

# Read-cache warming after a cold start (deploy / Redis flush). Bounded and run
# in the background so it never delays startup or readiness. Warms the bounded
# catalog keys always, and at most warm-max-stylers approved stylist profiles.
app.cache.warm-enabled=${CACHE_WARM_ENABLED:true}
app.cache.warm-max-stylers=${CACHE_WARM_MAX_STYLERS:25}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.allowed-folder-prefixes=${CLOUDINARY_ALLOWED_FOLDER_PREFIXES:profile,id,store,portfolio}


# Redis (geospatial location cache) — host port 6380 avoids clashing with
# Redis — afrochow-redis locally on 6379 (auth required), rapidstylers-redis in
# prod compose on 6379 (no auth). Empty REDIS_PASSWORD = "no auth" (optional).
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000

# Comma-separated trusted proxy IPs/CIDRs. When the app sits behind a proxy
# (e.g. Cloudflare -> nginx on the VPS), list those proxy ranges here so
# X-Forwarded-For is trusted only from them. Leave empty to ignore the header
# entirely and key rate limits by socket address. Examples:
#   app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:173.245.48.0/20,103.21.244.0/22}
app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}

# Kafka event bus. RapidStylers uses 9094 locally to avoid clashing with
# AfroChow's Kafka listener on 9092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
app.kafka.topics.domain-events=${KAFKA_TOPIC_DOMAIN_EVENTS:rapidstylers.domain-events}
app.kafka.topics.domain-events-retry=${KAFKA_TOPIC_DOMAIN_EVENTS_RETRY:rapidstylers.domain-events.retry}
app.kafka.topics.domain-events-dlq=${KAFKA_TOPIC_DOMAIN_EVENTS_DLQ:rapidstylers.domain-events.dlq}
app.kafka.outbox.publisher-enabled=${KAFKA_OUTBOX_PUBLISHER_ENABLED:true}
app.kafka.outbox.publisher-delay-ms=${KAFKA_OUTBOX_PUBLISHER_DELAY_MS:5000}
app.kafka.outbox.publish-timeout-seconds=${KAFKA_OUTBOX_PUBLISH_TIMEOUT_SECONDS:10}
app.kafka.outbox.retry-delay-seconds=${KAFKA_OUTBOX_RETRY_DELAY_SECONDS:30}
app.kafka.outbox.max-attempts=${KAFKA_OUTBOX_MAX_ATTEMPTS:3}
app.kafka.consumers.notifications.enabled=${KAFKA_NOTIFICATIONS_CONSUMER_ENABLED:true}
app.kafka.consumers.notifications.group-id=${KAFKA_NOTIFICATIONS_GROUP_ID:rapidstylers-notification-service}

# Google APIs (Places Autocomplete + Geocoding)
app.google.api-key=${GOOGLE_API_KEY:}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads/rapidstyler}

# Google Sign-In OAuth Client ID (from Google Cloud Console -> Credentials -> OAuth client ID). Public, safe to ship.
app.google.client-id=${GOOGLE_CLIENT_ID:}