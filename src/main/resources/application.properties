server.port=9095
# The security filters (JwtAuthFilter, AppConfig) hardcode /rapid_stylers-prefixed
# paths and the frontend calls api.rapidstylers.ca/rapid_stylers/... — serve under
# that context path. Nginx proxies the prefix through without stripping.
server.servlet.context-path=/rapid_stylers
# Actuator: expose only the health endpoint for Docker/Nginx health checks.
management.endpoints.web.exposure.include=health

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rapid_stylers}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect
spring.jpa.hibernate.ddl-auto=update

# Flyway schema migrations. baseline-on-migrate lets Flyway adopt the
# pre-existing JPA-created schema on first boot; version 0 marks that baseline
# so V1+ migrations apply deterministically on every environment.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:America/Edmonton}

# x-api-key shared with the frontend (RapidStyler_frontend/.env REACT_APP_API_KEY)
app.api.key=${APP_API_KEY}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:9090,https://rapidstylers.ca,https://www.rapidstylers.ca}

# Admin credentials — sign-in issues an ADMIN-role JWT
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# JWT (role-based auth)
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:120}

# Resend transactional email (replaces Gmail SMTP)
app.resend.api-key=${RESEND_API_KEY}
app.resend.from=${RESEND_FROM:onboarding@resend.dev}

# Cloudinary signed uploads (frontend uploads directly; backend signs)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}

# Stripe (card-on-file + payment intents). Leave STRIPE_SECRET_KEY empty to run
# in no-payment dev mode: bookings proceed without authorization.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.currency=${STRIPE_CURRENCY:cad}
# Platform commission taken from each captured payment (Stripe Connect payout share).
app.stripe.commission-percent=${STRIPE_COMMISSION_PERCENT:10}
# Card authorizations are created immediately only inside this window. Future
# bookings are authorized 48 hours before the appointment by the scheduler.
app.booking.payment-authorization-window-days=${BOOKING_PAYMENT_AUTHORIZATION_WINDOW_DAYS:7}
app.booking.payment-authorization-lead-hours=${BOOKING_PAYMENT_AUTHORIZATION_LEAD_HOURS:48}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.allowed-folder-prefixes=${CLOUDINARY_ALLOWED_FOLDER_PREFIXES:profile,id,store,portfolio}

# Pexels image gallery proxy (free tier: 200 req/hr; cached 1 hr server-side)
app.pexels.api-key=${PEXELS_API_KEY:}

# Redis (geospatial location cache) — host port 6380 avoids clashing with
# afrochow-redis, which owns 6379.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6380}
spring.redis.timeout=2000

# Comma-separated trusted proxy IPs/CIDRs. When the app sits behind a proxy
# (e.g. Cloudflare -> nginx on the VPS), list those proxy ranges here so
# X-Forwarded-For is trusted only from them. Leave empty to ignore the header
# entirely and key rate limits by socket address. Examples:
#   app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:173.245.48.0/20,103.21.244.0/22}
app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}

# Kafka event bus. RapidStylers uses 9094 locally to avoid clashing with
# AfroChow's Kafka listener on 9092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
app.kafka.topics.domain-events=${KAFKA_TOPIC_DOMAIN_EVENTS:rapidstylers.domain-events}
app.kafka.topics.domain-events-retry=${KAFKA_TOPIC_DOMAIN_EVENTS_RETRY:rapidstylers.domain-events.retry}
app.kafka.topics.domain-events-dlq=${KAFKA_TOPIC_DOMAIN_EVENTS_DLQ:rapidstylers.domain-events.dlq}
app.kafka.outbox.publisher-enabled=${KAFKA_OUTBOX_PUBLISHER_ENABLED:true}
app.kafka.outbox.publisher-delay-ms=${KAFKA_OUTBOX_PUBLISHER_DELAY_MS:5000}
app.kafka.outbox.publish-timeout-seconds=${KAFKA_OUTBOX_PUBLISH_TIMEOUT_SECONDS:10}
app.kafka.outbox.retry-delay-seconds=${KAFKA_OUTBOX_RETRY_DELAY_SECONDS:30}
app.kafka.outbox.max-attempts=${KAFKA_OUTBOX_MAX_ATTEMPTS:3}
app.kafka.consumers.notifications.enabled=${KAFKA_NOTIFICATIONS_CONSUMER_ENABLED:true}
app.kafka.consumers.notifications.group-id=${KAFKA_NOTIFICATIONS_GROUP_ID:rapidstylers-notification-service}

# Google APIs (Places Autocomplete + Geocoding)
app.google.api-key=${GOOGLE_API_KEY:}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads/rapidstyler}
