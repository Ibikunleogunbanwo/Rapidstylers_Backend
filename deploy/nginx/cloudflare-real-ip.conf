# Cloudflare real-IP snippet for nginx.
#
# Install: cp deploy/nginx/cloudflare-real-ip.conf /etc/nginx/conf.d/
# This file is included at http level, so every server on this host treats
# Cloudflare edge IPs as trusted proxies and uses CF-Connecting-IP as the real
# client address. Rate limiting then sees the actual user, not 104.x/172.x.
#
# It also sets $from_cloudflare (1 or 0) so the API site can refuse requests
# that skipped Cloudflare and came straight to the VPS IP (see the `if` at the
# top of sites-available/api.YOURDOMAIN.com.conf).
#
# IMPORTANT: refresh these from https://www.cloudflare.com/ips/ before enabling —
# Cloudflare occasionally changes ranges. The list appears twice in this file
# (set_real_ip_from and the geo block below): update both together. IPv6 lines
# are harmless on an IPv4-only VPS but are commented out; uncomment if you
# enable IPv6.

# Cloudflare IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 (uncomment if the VPS has IPv6 + an AAAA record)
#set_real_ip_from 2400:cb00::/32;
#set_real_ip_from 2606:4700::/32;
#set_real_ip_from 2803:f800::/32;
#set_real_ip_from 2405:b500::/32;
#set_real_ip_from 2405:8100::/32;
#set_real_ip_from 2a06:98c0::/29;
#set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Was this request handed to us by Cloudflare? Checked against the original
# peer address ($realip_remote_addr), not the rewritten visitor address.
geo $realip_remote_addr $from_cloudflare {
    default 0;
    127.0.0.1 1;        # on-box checks, e.g. curl --resolve from the VPS
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    #2400:cb00::/32 1;
    #2606:4700::/32 1;
    #2803:f800::/32 1;
    #2405:b500::/32 1;
    #2405:8100::/32 1;
    #2a06:98c0::/29 1;
    #2c0f:f248::/32 1;
}
