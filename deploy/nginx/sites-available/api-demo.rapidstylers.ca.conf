# RapidStylers demo API (api-demo.rapidstylers.ca) -> the app-demo container.
#
# Same rules as the live API site, pointed at port 9096. Install on the VPS:
#   sudo cp deploy/nginx/sites-available/api-demo.rapidstylers.ca.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api-demo.rapidstylers.ca.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate paths are the live site's. A Cloudflare Origin certificate
# normally covers *.rapidstylers.ca; if yours lists only api.rapidstylers.ca,
# issue a new one that includes api-demo.rapidstylers.ca.

server {
    listen 443 ssl http2;
    server_name api-demo.rapidstylers.ca;

    # Only Cloudflare may talk to this site ($from_cloudflare comes from
    # /etc/nginx/conf.d/cloudflare-real-ip.conf, already installed).
    if ($from_cloudflare = 0) {
        return 444;
    }

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Search engines must not index the showroom's API.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:9096;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
