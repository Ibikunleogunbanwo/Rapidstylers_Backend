# RapidStylers API — nginx site template
#
# Source of truth: docs/duplication-guide.md §3. Install:
#   1. Replace every api.YOURDOMAIN.com with your real domain.
#   2. Put the Cloudflare Origin CA cert + key at the paths below.
#   3. cp cloudflare-real-ip.conf from deploy/nginx/ to /etc/nginx/conf.d/
#   4. ln -s this file into /etc/nginx/sites-enabled/ , `nginx -t`, `systemctl reload nginx`.
#
# Only this API is served by this host's nginx. The frontend (rapidstylers.ca /
# www) lives on Vercel — do NOT proxy it here.

server {
    # nginx >= 1.25.1 can use: listen 443 ssl; http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;          # remove this line if the VPS has no IPv6
    server_name api.YOURDOMAIN.com;

    # Cloudflare Origin CA certificate (see deploy/cloudflare/origin-cert.md).
    # The PEM bundle includes the Cloudflare Origin CA root — do not split it.
    ssl_certificate     /etc/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Requests arrive from Cloudflare, not browsers. $remote_addr is the real
    # client once cloudflare-real-ip.conf is installed (CF-Connecting-IP).
    # HSTS is also set by Spring Security on secure requests; enabling it here
    # as well is harmless and covers responses that bypass the filter chain.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Uploads go straight from the browser to Cloudinary (backend-signed), so
    # the API sees small JSON bodies only. Webhooks also arrive here.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:9095;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass Cloudflare's client-IP header through untouched so the app's
        # RATE_LIMIT_TRUSTED_PROXIES handling can use it if real_ip is off.
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # If the frontend ever needs WebSockets, add:
        #   proxy_set_header Upgrade $http_upgrade;
        #   proxy_set_header Connection "upgrade";
    }

    # Long-lived responses (polling, retries) are already handled app-side via
    # idempotency keys; keep the proxy short so a hung worker is retried.
    proxy_buffering on;
}

# HTTP -> HTTPS (Cloudflare usually handles this redirect; kept for direct hits
# and for the case where the domain is temporarily DNS-only/grey-clouded).
server {
    listen 80;
    listen [::]:80;
    server_name api.YOURDOMAIN.com;
    return 301 https://$host$request_uri;
}
