name: Backend CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rapid_stylers
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Redis and Kafka are not started in CI: the services fail closed with
      # in-memory fallbacks, and the test profile disables the Kafka consumers.
      - name: Run tests
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/rapid_stylers
          DB_USERNAME: root
          DB_PASSWORD: root
        run: ./mvnw -B test

  deploy:
    name: Deploy to VPS
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "$SSH_KEY" > /tmp/deploy_key

      - name: Rsync tested commit to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'rapiddeploy' }}
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'target' \
            --exclude '.github' \
            -e "ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key" \
            ./ ${VPS_USER}@${VPS_HOST}:/opt/rapidstylers/backend/

      - name: Rebuild and restart the API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'rapiddeploy' }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key ${VPS_USER}@${VPS_HOST} \
            "cd /opt/rapidstylers/backend && docker compose -f docker-compose.prod.yml up -d --build app"

      - name: Wait for healthy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'rapiddeploy' }}
        run: |
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key ${VPS_USER}@${VPS_HOST} \
              "curl -fsS http://127.0.0.1:9095/actuator/health >/dev/null 2>&1"; then
              echo "API healthy"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Clean up key
        if: always()
        run: rm -f /tmp/deploy_key
