name: Backend CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rapid_stylers
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Redis and Kafka are not started in CI: the services fail closed with
      # in-memory fallbacks, and the test profile disables the Kafka consumers.
      #
      # ./mvn21 is the single source of truth for JDK selection (local + CI):
      # it validates the setup-java JDK (17) and fails loudly if it ever drifts
      # outside the Lombok-compatible 17-21 range, then delegates to ./mvnw.
      - name: Run tests
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/rapid_stylers
          DB_USERNAME: root
          DB_PASSWORD: root
        run: ./mvn21 -B test

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Fails the build if any commit in the pushed history contains a secret
      # (API keys, passwords, private keys...). This is what caught the leaked
      # Google API key and the admin-password fragment after the fact — now it
      # runs before code can ever reach GitHub.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to VPS
    needs: [tests, gitleaks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "$SSH_KEY" > /tmp/deploy_key

      # The production ENCRYPT_KEY otherwise exists only in the VPS .env, which
      # the rsync below never overwrites (--exclude .env). A wiped disk or a
      # re-provisioned server would therefore lose it — and an empty ENCRYPT_KEY
      # is exactly how this API was taken down once. The script restores a
      # missing key from the repository secret but refuses to overwrite a
      # differing one, because that would silently rotate the key with no
      # migration. The value travels in a 0600 file rather than on the command
      # line, so it never shows up in the process list of a shared host.
      - name: Reconcile ENCRYPT_KEY from the repository secret
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'rapiddeploy' }}
          ENCRYPT_KEY_SECRET: ${{ secrets.ENCRYPT_KEY }}
        run: |
          umask 077
          if [ -z "$ENCRYPT_KEY_SECRET" ]; then
            echo "::notice::Repository secret ENCRYPT_KEY is not set — skipping reconciliation."
            echo "::warning::The key stays only on the VPS, so it cannot be recovered after a re-provision. Add the secret to fix that."
            exit 0
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$ENCRYPT_KEY_SECRET" > "$KEY_FILE"
          scp -q -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key \
            "$KEY_FILE" ${VPS_USER}@${VPS_HOST}:/tmp/rapidstylers-encrypt-key
          ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key ${VPS_USER}@${VPS_HOST} \
            'ENCRYPT_KEY_SECRET_FILE=/tmp/rapidstylers-encrypt-key bash -s; rc=$?; rm -f /tmp/rapidstylers-encrypt-key; exit $rc' \
            < scripts/reconcile-encrypt-key.sh

      # Fail in seconds when the VPS is missing configuration the app cannot start
      # without. Before this, a blank value surfaced only as a ~6 minute health-gate
      # timeout with the cause buried in the container's logs — how a missing
      # ENCRYPT_KEY took the API down. Runs before the rsync, so a failed check
      # leaves the VPS completely untouched.
      #
      # A correct .env is necessary but not sufficient: compose forwards only the
      # variables its `environment:` block names, so a required value missing from
      # there never reaches the container and the app still crash-loops. The compose
      # file from *this* commit is copied over and checked too, rather than the
      # (possibly older) one already on the box.
      - name: Pre-flight required configuration on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'rapiddeploy' }}
        run: |
          scp -q -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key \
            docker-compose.prod.yml ${VPS_USER}@${VPS_HOST}:/tmp/rapidstylers-compose.yml
          # '' leaves argument 1 empty, so the script keeps its own default .env path.
          ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key ${VPS_USER}@${VPS_HOST} \
            'bash -s -- "" /tmp/rapidstylers-compose.yml' < scripts/check-required-env.sh

      - name: Rsync tested commit to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'rapiddeploy' }}
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'target' \
            --exclude '.github' \
            -e "ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key" \
            ./ ${VPS_USER}@${VPS_HOST}:/opt/rapidstylers/backend/

      - name: Rebuild and restart the API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'rapiddeploy' }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key ${VPS_USER}@${VPS_HOST} \
            "cd /opt/rapidstylers/backend && docker compose -f docker-compose.prod.yml up -d --build app"

      - name: Wait for healthy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'rapiddeploy' }}
        run: |
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key ${VPS_USER}@${VPS_HOST} \
              "curl -fsS http://127.0.0.1:9095/actuator/health >/dev/null 2>&1"; then
              echo "API healthy"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy in time"
          exit 1

      # The container boot log is the only place the cause of a crash-loop
      # appears, and nobody may be at a keyboard during an outage. Dumping it
      # here means a failed deploy explains itself in the run's own output.
      - name: Dump VPS state when the API will not come up
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'rapiddeploy' }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key ${VPS_USER}@${VPS_HOST} '
            cd /opt/rapidstylers/backend || exit 0
            echo "===== compose ps -a ====="
            docker compose -f docker-compose.prod.yml ps -a 2>&1 || true
            echo "===== app logs (tail 250) ====="
            docker compose -f docker-compose.prod.yml logs --tail=250 app 2>&1 || true
            echo "===== flyway_schema_history ====="
            set -a; . ./.env 2>/dev/null; set +a
            docker compose -f docker-compose.prod.yml exec -T -e MYSQL_PWD="$DB_PASSWORD" \
              mysql mysql -uroot rapid_stylers \
              -e "SELECT installed_rank, version, description, success FROM flyway_schema_history ORDER BY installed_rank;" 2>&1 || true
          ' || true

      - name: Clean up key
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'rapiddeploy' }}
        run: |
          # The compose copy is not secret (it is in the repo), but it should not
          # outlive the run. Removed before the key that authenticates it, and
          # `|| true` because cleanup must never be what fails a job.
          ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key ${VPS_USER}@${VPS_HOST} \
            'rm -f /tmp/rapidstylers-compose.yml' || true
          rm -f /tmp/deploy_key
