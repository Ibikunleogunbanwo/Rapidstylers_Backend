# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Backend JVM dependencies (Spring Boot parent, Flyway, MySQL driver, ...).
  # Weekly cadence keeps the PR queue small; major upgrades such as the
  # Spring Boot 3.x parent are tracked in the dedicated migration issue and
  # should be routed there, not merged blindly.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"

  # GitHub Actions used by the CI workflow (checkout, setup-java, gitleaks, ...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
