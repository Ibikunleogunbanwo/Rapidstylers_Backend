# Production Compose for the RapidStylers VPS.
# All infrastructure (mysql/redis/kafka) is private to the Docker network —
# only the API port is published, and only on loopback for Nginx to proxy.
#
# Requires a .env in the same directory (see .env.example). Key production values:
#   DB_NAME=rapid_stylers            (rapidstylers_live from launch day)
#   DEMO_JWT_SECRET=<different from JWT_SECRET>   (only for the demo profile)
#   REDIS_HOST=redis
#   REDIS_PORT=6379
#   KAFKA_BOOTSTRAP_SERVERS=kafka:19094
#   KAFKA_EXTERNAL_ADVERTISED_HOST=127.0.0.1

services:
  mysql:
    image: mysql:8.0
    container_name: rapidstylers-mysql
    environment:
      MYSQL_DATABASE: rapid_stylers
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    # InnoDB durability defaults kept strict so whole-server snapshot
    # backups restore reliably (innodb_flush_log_at_trx_commit=1).
    command: --innodb-buffer-pool-size=1G
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rapidstylers-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.2
    container_name: rapidstylers-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9096
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19094,CONTROLLER://0.0.0.0:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx1g}
      # Bounded retention so the 100 GB disk never fills from event history.
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-72}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-5368709120}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19094 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.2
    container_name: rapidstylers-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19094 --create --if-not-exists --topic rapidstylers.domain-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19094 --create --if-not-exists --topic rapidstylers.domain-events.retry --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19094 --create --if-not-exists --topic rapidstylers.domain-events.dlq --partitions 3 --replication-factor 1
    restart: "no"

  app:
    build: .
    image: rapidstylers-api:latest
    container_name: rapidstylers-api
    depends_on: &app-depends
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Anchored so app-demo below starts from exactly the same settings.
    environment: &app-env
      # Deliberately NOT taken from .env: inside the compose network the database
      # host is the service name, and .env.example ships `localhost` for local runs.
      # Honouring that value here would point the container at itself.
      # DB_NAME picks the database inside the MySQL container. Launch day sets
      # DB_NAME=rapidstylers_live in the VPS .env; rapid_stylers then stays as
      # the showcase that app-demo serves.
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-rapid_stylers}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_API_KEY: ${APP_API_KEY}
      # Hibernate only checks the schema against the entities; Flyway migrations
      # are the only thing that changes it. The live schema was checked against
      # validate on 2026-10-10 (see V16). Emergency escape hatch: set
      # SPRING_JPA_HIBERNATE_DDL_AUTO=update in the VPS .env and redeploy.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      # Browser origins allowed to call the API (comma-separated, exact match).
      # Defaults to the app's own list; set it to restrict or extend.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:9090,https://rapidstylers.ca,https://www.rapidstylers.ca}
      # The demo site may post the newsletter form and visit count (only) to the live API.
      CORS_NEWSLETTER_ORIGINS: ${CORS_NEWSLETTER_ORIGINS:-https://demo.rapidstylers.ca}
      # Timezone for booking and slot calculations.
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Edmonton}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      # Signing secret of the Resend bounce/complaint webhook (not the API key).
      # Empty keeps the webhook switched off (it answers 503).
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      # Bases for newsletter links: one-click unsubscribe (API) and the footer page (website).
      NEWSLETTER_API_URL: ${NEWSLETTER_API_URL:-https://api.rapidstylers.ca}
      NEWSLETTER_SITE_URL: ${NEWSLETTER_SITE_URL:-https://rapidstylers.ca}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Portfolios may only live under these Cloudinary folder prefixes.
      CLOUDINARY_ALLOWED_FOLDER_PREFIXES: ${CLOUDINARY_ALLOWED_FOLDER_PREFIXES:-profile,id,store,portfolio}
      # Signed upload constraints — Cloudinary enforces these because they are
      # part of the signature, so a client cannot widen them.
      CLOUDINARY_ALLOWED_FORMATS: ${CLOUDINARY_ALLOWED_FORMATS:-jpg,jpeg,png,webp,gif}
      CLOUDINARY_MAX_FILE_SIZE_BYTES: ${CLOUDINARY_MAX_FILE_SIZE_BYTES:-5242880}
      CLOUDINARY_INCOMING_TRANSFORMATION: ${CLOUDINARY_INCOMING_TRANSFORMATION:-c_limit,h_2000,w_2000}
      # Cloudflare Turnstile bot protection on the sign-in endpoints. Empty
      # disables the challenge (the app still boots); setting it turns it on.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_VERIFY_URL: ${TURNSTILE_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}
      # Local upload directory, used only when Cloudinary is not configured.
      FILE_UPLOAD_DIR: ${FILE_UPLOAD_DIR:-uploads/rapidstyler}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Demo seed: APP_DEMO_SEED=true makes boot create one approved demo
      # stylist per service type so public search is never all-empty on a
      # fresh/wiped database. Default off; real stylists are never touched.
      APP_DEMO_SEED: ${APP_DEMO_SEED:-false}
      # The live app is never the read-only showroom; only app-demo sets true.
      APP_DEMO_READ_ONLY: "false"
      # Where the demo's banner and refusals send visitors.
      APP_DEMO_LIVE_URL: ${APP_DEMO_LIVE_URL:-https://rapidstylers.ca}
      # API docs (/swagger-ui.html, /v3/api-docs). Off in production: the
      # x-api-key ships in the website, so it would publish a map of every route.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-15}
      ENCRYPT_KEY: ${ENCRYPT_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      STRIPE_MODE: ${STRIPE_MODE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
      STRIPE_TEST_CONNECT_WEBHOOK_SECRET: ${STRIPE_TEST_CONNECT_WEBHOOK_SECRET:-}
      STRIPE_LIVE_SECRET_KEY: ${STRIPE_LIVE_SECRET_KEY:-}
      STRIPE_LIVE_WEBHOOK_SECRET: ${STRIPE_LIVE_WEBHOOK_SECRET:-}
      STRIPE_LIVE_CONNECT_WEBHOOK_SECRET: ${STRIPE_LIVE_CONNECT_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-cad}
      STRIPE_COMMISSION_PERCENT: ${STRIPE_COMMISSION_PERCENT:-10}
      # Ops alert email for payment disputes / reconciliation findings (optional).
      APP_ADMIN_ALERT_EMAIL: ${APP_ADMIN_ALERT_EMAIL:-}
      # Structured log shipping (Better Stack) — optional; unset keeps console JSON only.
      LOG_TOKEN: ${LOG_TOKEN:-}
      LOG_ENDPOINT: ${LOG_ENDPOINT:-https://in.logs.betterstack.com}
      # Error monitoring — optional; unset keeps Sentry dormant.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Sentry environment label. Set APP_ENV=production in the VPS .env, otherwise
      # production errors are filed under "local" and are hard to separate.
      APP_ENV: ${APP_ENV:-local}
      # Fraction of requests traced by Sentry (0.0 = errors only).
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      # Also container-network literals, not .env values — see DB_URL above.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # prod redis runs without a password; set REDIS_PASSWORD in the VPS .env
      # only if you later enable `redis-server --requirepass <pw>`.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Startup cache warm-up, and the cap on how many stylers are primed.
      CACHE_WARM_ENABLED: ${CACHE_WARM_ENABLED:-true}
      CACHE_WARM_MAX_STYLERS: ${CACHE_WARM_MAX_STYLERS:-25}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19094
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_TOPIC_DOMAIN_EVENTS: ${KAFKA_TOPIC_DOMAIN_EVENTS:-rapidstylers.domain-events}
      KAFKA_TOPIC_DOMAIN_EVENTS_RETRY: ${KAFKA_TOPIC_DOMAIN_EVENTS_RETRY:-rapidstylers.domain-events.retry}
      KAFKA_TOPIC_DOMAIN_EVENTS_DLQ: ${KAFKA_TOPIC_DOMAIN_EVENTS_DLQ:-rapidstylers.domain-events.dlq}
      KAFKA_OUTBOX_PUBLISHER_ENABLED: ${KAFKA_OUTBOX_PUBLISHER_ENABLED:-true}
      # Outbox relay pacing: how often the poller runs, how long a publish may take,
      # how long to wait before retrying, and how many attempts before parking the
      # row for manual attention.
      KAFKA_OUTBOX_PUBLISHER_DELAY_MS: ${KAFKA_OUTBOX_PUBLISHER_DELAY_MS:-5000}
      KAFKA_OUTBOX_PUBLISH_TIMEOUT_SECONDS: ${KAFKA_OUTBOX_PUBLISH_TIMEOUT_SECONDS:-10}
      KAFKA_OUTBOX_RETRY_DELAY_SECONDS: ${KAFKA_OUTBOX_RETRY_DELAY_SECONDS:-30}
      KAFKA_OUTBOX_MAX_ATTEMPTS: ${KAFKA_OUTBOX_MAX_ATTEMPTS:-3}
      KAFKA_NOTIFICATIONS_CONSUMER_ENABLED: ${KAFKA_NOTIFICATIONS_CONSUMER_ENABLED:-true}
      # Consumer group for notification delivery. CHANGING THIS IS NOT SAFE in
      # passing: a new group makes Kafka start from its own offsets, so events are
      # replayed or skipped and recipients can be notified twice for anything older
      # than NOTIFICATION_DEDUP_TTL_HOURS. The deploy pre-flight warns when the value
      # in .env differs from this default.
      KAFKA_NOTIFICATIONS_GROUP_ID: ${KAFKA_NOTIFICATIONS_GROUP_ID:-rapidstylers-notification-service}
      # Consumer idempotency: how long a delivered notification event is remembered (hours).
      NOTIFICATION_DEDUP_TTL_HOURS: ${NOTIFICATION_DEDUP_TTL_HOURS:-24}
      # Stylists may cancel a completed booking within this window (hours since completion).
      STYLER_CANCEL_WINDOW_HOURS: ${STYLER_CANCEL_WINDOW_HOURS:-24}
      # How long a booking authorization may be held before capture (hours), and how
      # far ahead a booking may be authorized (days).
      BOOKING_PAYMENT_AUTHORIZATION_LEAD_HOURS: ${BOOKING_PAYMENT_AUTHORIZATION_LEAD_HOURS:-48}
      PAYOUT_REQUIRE_ACCOUNT_TO_ACCEPT: ${PAYOUT_REQUIRE_ACCOUNT_TO_ACCEPT:-true}
      BOOKING_PAYMENT_AUTHORIZATION_WINDOW_DAYS: ${BOOKING_PAYMENT_AUTHORIZATION_WINDOW_DAYS:-7}
      # Payout recovery: retry interval (ms) and attempt budget for transfer reversals.
      PAYOUT_REVERSAL_RETRY_INTERVAL_MS: ${PAYOUT_REVERSAL_RETRY_INTERVAL_MS:-1800000}
      PAYOUT_REVERSAL_MAX_ATTEMPTS: ${PAYOUT_REVERSAL_MAX_ATTEMPTS:-5}
      # The app's only direct peer is Nginx, reached through the Docker userland
      # proxy: trust loopback and the Docker bridge gateway (docker-proxy forwards
      # 127.0.0.1:9095 into the container, so Nginx appears as the bridge peer).
      # Cloudflare's ranges are NOT listed here: Nginx already trusts them
      # (deploy/nginx/cloudflare-real-ip.conf) and puts the real client IP at the
      # right-hand end of X-Forwarded-For. One list, one place to update.
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-127.0.0.1/32,172.18.0.1/32}
      # Server-side idle timeout per role (minutes), defaulting to the same
      # customer/styler/admin windows as application.properties.
      SESSION_IDLE_CUSTOMER_MINUTES: ${SESSION_IDLE_CUSTOMER_MINUTES:-60}
      SESSION_IDLE_STYLER_MINUTES: ${SESSION_IDLE_STYLER_MINUTES:-30}
      SESSION_IDLE_ADMIN_MINUTES: ${SESSION_IDLE_ADMIN_MINUTES:-30}
      # Force an admin to re-login after this many hours, even if active.
      SESSION_ABSOLUTE_ADMIN_HOURS: ${SESSION_ABSOLUTE_ADMIN_HOURS:-8}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms512m -Xmx2g}
    ports:
      # Loopback only — Nginx on the host proxies 443 -> this port.
      - "127.0.0.1:9095:9095"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9095/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # The demo showroom (demo.rapidstylers.ca): the same image reading the showcase
  # database, read-only for visitors. Off unless started with the demo profile:
  #   docker compose -f docker-compose.prod.yml --profile demo up -d app-demo
  # Every override below keeps it apart from the live app: its own database,
  # Redis database 1 (cache, rate limits, sign-out cut-offs), no Kafka traffic
  # (so no emails), Stripe test mode, its own JWT secret.
  app-demo:
    image: rapidstylers-api:latest
    container_name: rapidstylers-api-demo
    profiles: ["demo"]
    depends_on: *app-depends
    environment:
      <<: *app-env
      DB_URL: jdbc:mysql://mysql:3306/${DEMO_DB_NAME:-rapid_stylers}
      SPRING_REDIS_DATABASE: "1"
      APP_DEMO_READ_ONLY: "true"
      APP_DEMO_SEED: "false"
      APP_ENV: demo
      CORS_ALLOWED_ORIGINS: ${DEMO_CORS_ALLOWED_ORIGINS:-https://demo.rapidstylers.ca}
      # Must differ from JWT_SECRET. Left empty, the demo app refuses to start
      # (JwtUtil's boot guard), so a missing value can never fall back to the live one.
      JWT_SECRET: ${DEMO_JWT_SECRET:-}
      KAFKA_OUTBOX_PUBLISHER_ENABLED: "false"
      KAFKA_NOTIFICATIONS_CONSUMER_ENABLED: "false"
      KAFKA_NOTIFICATIONS_GROUP_ID: rapidstylers-demo-notifications
      # Test keys only: the single legacy key and every live key are blanked.
      STRIPE_MODE: test
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_CONNECT_WEBHOOK_SECRET: ""
      STRIPE_LIVE_SECRET_KEY: ""
      STRIPE_LIVE_WEBHOOK_SECRET: ""
      STRIPE_LIVE_CONNECT_WEBHOOK_SECRET: ""
      CACHE_WARM_MAX_STYLERS: "25"
      JAVA_TOOL_OPTIONS: ${DEMO_JAVA_TOOL_OPTIONS:--Xms256m -Xmx768m}
    ports:
      # Loopback only, like the live app; Nginx proxies api-demo.rapidstylers.ca here.
      - "127.0.0.1:9096:9095"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9095/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  kafka-data:
